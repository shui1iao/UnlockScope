name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: 386
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dir="unlockscope_${version}_${GOOS}_${GOARCH}"
          mkdir -p "$dir"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$dir/unlockscope" ./cmd/unlockscope
          cp README.md README.en.md LICENSE SECURITY.md "$dir/"
          tar -C "$dir" -czf "${dir}.tar.gz" .
          sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
      - name: Upload package
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: unlockscope_*_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          gh release create "$TAG" dist/* --verify-tag --generate-notes --title "UnlockScope $TAG"
